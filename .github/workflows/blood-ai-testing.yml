name: Blood AI Complete Automated Testing Suite & Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =================================================================
  # 1. PERFORMANCE TESTING (K6 & HTTP Benchmark Engine)
  # =================================================================
  performance-tests:
    name: 1. K6 Performance Benchmark (Baseline, Stress, Spike, Soak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup K6 Engine
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update || true
          sudo apt-get install -y k6 || true

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          cd performance-tests && npm install || true

      - name: Start Blood AI Backend Server
        env:
          PORT: 5000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mkmkwvvousvrpghwaldt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_ipZdWGHj1l24QhlLvaK1fw_f3r676gK' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'bloodbank-smart-system-secret-2024' }}
        run: |
          if [ -d "../Blood AI/Blood AI/server" ]; then
            cd "../Blood AI/Blood AI/server" && npm install && npm start &
          elif [ -d "server" ]; then
            cd server && npm install && npm start &
          fi
          sleep 5
          curl -s http://localhost:5000/api/health || echo "Server starting..."

      - name: Run Baseline Load Test (100 VUs)
        run: |
          cd performance-tests
          node run-perf-tests.js baseline || k6 run baseline-load.js || true

      - name: Run Stress Test (Ramp up to 250 VUs)
        run: |
          cd performance-tests
          node run-perf-tests.js stress || k6 run stress-test.js || true

      - name: Run Spike Test (Traffic Burst to 200 VUs)
        run: |
          cd performance-tests
          node run-perf-tests.js spike || k6 run spike-test.js || true

      - name: Run Soak / Endurance Test (Continuous 50 VUs)
        run: |
          cd performance-tests
          node run-perf-tests.js soak || k6 run soak-test.js || true

      - name: Upload Performance Summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-summaries
          path: test-reports/summary/*-summary.json
          retention-days: 7

  # =================================================================
  # 2. SELENIUM WEB E2E AUTOMATION (308 Test Cases)
  # =================================================================
  selenium-e2e-tests:
    name: 2. Selenium Web E2E Suite (308 Test Cases across 20 Modules)
    runs-on: ubuntu-latest
    needs: [performance-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Headless Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Project & Test Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          cd selenium-tests && npm install || true

      - name: Execute 308 Selenium E2E Web Test Cases
        env:
          BLOOD_AI_WEB_URL: 'http://localhost:5000'
        run: |
          cd selenium-tests
          node run-selenium-tests.js

      - name: Upload Selenium Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-summary
          path: test-reports/summary/selenium-e2e-summary.json
          retention-days: 7

  # =================================================================
  # 3. APPIUM ANDROID E2E AUTOMATION (312 Test Cases)
  # =================================================================
  appium-android-e2e-tests:
    name: 3. Appium Android E2E Suite (312 Test Cases - com.lifelink.bloodai)
    runs-on: ubuntu-latest
    needs: [performance-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium Dependencies
        run: |
          cd appium-tests && npm install || true

      - name: Execute 312 Appium Android Native Mobile Tests
        run: |
          cd appium-tests
          node run-appium-tests.js

      - name: Upload Appium Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-summary
          path: test-reports/summary/appium-e2e-summary.json
          retention-days: 7

  # =================================================================
  # 4. EXCEL REPORTS GENERATION & ARTIFACTS PUBLICATION (7 EXCEL FILES)
  # =================================================================
  generate-and-upload-excel-reports:
    name: 4. Generate 7 Excel Reports & Publish Artifacts
    runs-on: ubuntu-latest
    needs: [selenium-e2e-tests, appium-android-e2e-tests]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Performance Summaries
        uses: actions/download-artifact@v4
        with:
          name: perf-summaries
          path: test-reports/summary
        continue-on-error: true

      - name: Download Selenium Summary
        uses: actions/download-artifact@v4
        with:
          name: selenium-summary
          path: test-reports/summary
        continue-on-error: true

      - name: Download Appium Summary
        uses: actions/download-artifact@v4
        with:
          name: appium-summary
          path: test-reports/summary
        continue-on-error: true

      - name: Install ExcelJS & Dependencies
        run: |
          npm install exceljs --no-save

      - name: Generate All 7 Comprehensive Excel Reports
        run: |
          cd test-reports
          node generate-excel-reports.js

      - name: Verify Generated Excel Files
        run: |
          ls -la test-reports/excel/
          test -f test-reports/excel/Baseline_Load_Test_Report.xlsx
          test -f test-reports/excel/Stress_Test_Report.xlsx
          test -f test-reports/excel/Spike_Test_Report.xlsx
          test -f test-reports/excel/Soak_Test_Report.xlsx
          test -f test-reports/excel/Selenium_E2E_Test_Report.xlsx
          test -f test-reports/excel/Appium_E2E_Test_Report.xlsx
          test -f test-reports/excel/Blood_AI_Overall_Test_Summary.xlsx

      # Downloadable Excel Reports Artifact
      - name: Upload Blood AI All Test Excel Reports (7 .xlsx Files)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blood-AI-All-Test-Excel-Reports
          path: |
            test-reports/excel/Baseline_Load_Test_Report.xlsx
            test-reports/excel/Stress_Test_Report.xlsx
            test-reports/excel/Spike_Test_Report.xlsx
            test-reports/excel/Soak_Test_Report.xlsx
            test-reports/excel/Selenium_E2E_Test_Report.xlsx
            test-reports/excel/Appium_E2E_Test_Report.xlsx
            test-reports/excel/Blood_AI_Overall_Test_Summary.xlsx
          retention-days: 30
